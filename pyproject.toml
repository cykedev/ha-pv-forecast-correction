[project]
name = "pv-forecast-correction"
version = "0.7.0"
description = "Home Assistant integration that corrects a PV forecast with measured production."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "PIE",
    "PT",   # pytest style
    "RUF",
    "SIM",
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "pvfc_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
